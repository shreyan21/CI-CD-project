on:
    push:
        branches: ["master"]
      
permissions:
  id-token: write
  contents: read

jobs:
    checkout-code:
        runs-on: ubuntu-latest
        steps:
            - name: Loading code
              uses: actions/checkout@v7
        
            - name: Building image
              uses: docker/setup-buildx-action@v4

            - name: Logging into AWS ECR
              uses: aws-actions/configure-aws-credentials@v6
              with:
                role-to-assume: ${{vars.AWS_ROLE_ARN}}
                aws-region: ${{vars.AWS_REGION}}

            - name: Logging into AWS ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Building and pushing backend image to registry
              uses: docker/build-push-action@v6
              with:
                context: ./backend/
                tags: my-ecr/backend:latest
                push: true
             
            - name: Building and pushing frontend image to registry
              uses: docker/build-push-action@v6
              with:
                context: ./frontend/
                tags: my-ecr/frontend:latest
                push: true

            


            
           

            
           
   

        