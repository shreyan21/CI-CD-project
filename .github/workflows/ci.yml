on:
  push:
    branches: ["master"]

permissions:
  id-token: write
  contents: read

jobs:
  CI-CD-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Loading code
        uses: actions/checkout@v7

      - name: Installing docker
        uses: docker/setup-buildx-action@v2

      - name: Logging into AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          aws-region: ${{vars.AWS_REGION}}

      - name: Logging into ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Installing nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Running tests
        working-directory: ./backend
        run: |
          npm ci  
          npm test



          

      - name: Installing docker
        uses: docker/setup-buildx-action@v2

      - name: Running docker compose
        run: |
         # Compose loads env_file entries even for builds. Use examples only;
         # deployment configuration stays on the EC2 host.
         cp .env.example .env
         cp backend/.env.example backend/.env
         cp frontend/.env.example frontend/.env
         docker compose build
         docker tag backend:v1.0 891377368653.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:backendv2.0
         docker tag frontend:v1.0 891377368653.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:frontendv2.0
         docker push 891377368653.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:backendv2.0
         docker push 891377368653.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:frontendv2.0

      - name: Sending commands to SSM agent on EC2
        run: |
          
          COMMAND_ID=$(aws ssm send-command \
               --instance-ids "${{vars.AWS_INSTANCE_ID}}" \
               --document-name "AWS-RunShellScript" \
               --query 'Command.CommandId' \
               --output text \
               --parameters 'commands=["set -e ","cd /home/ubuntu","aws ecr get-login-password --region ${{vars.AWS_REGION}} | docker login --username AWS --password-stdin ${{vars.ECR_REGISTRY}}","docker compose up -d db","docker compose up -d --pull always --no-deps frontend backend","docker compose exec -T backend npm run db:migrate"]')

          set +e

          aws ssm wait command-executed \
                --command-id "$COMMAND_ID" \
                --instance-id "${{vars.AWS_INSTANCE_ID}}"

          WAIT_STATUS=$?
          set -e
          aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{vars.AWS_INSTANCE_ID}}"

          exit "$WAIT_STATUS"
         
    
         
         

