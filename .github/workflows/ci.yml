on:
  push:
    branches: ["master"]

permissions:
  id-token: write
  contents: read

jobs:
  CI-CD-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Loading code
        uses: actions/checkout@v7

      - name: Installing docker
        uses: docker/setup-buildx-action@v2

      - name: Logging into AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          aws-region: ${{vars.AWS_REGION}}

      - name: Logging into ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Installing nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Running tests
        working-directory: ./backend
        run: |
          npm ci  
          npm test



          

      - name: Installing docker
        uses: docker/setup-buildx-action@v2

      - name: Building and publishing images
        run: |
         # Runtime .env files are configured manually; image builds do not need them.
         docker build -t backend:v1.0 ./backend
         docker build -t frontend:v1.0 ./frontend
         docker tag backend:v1.0 891377368653.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:backend-v2.0
         docker tag frontend:v1.0 891377368653.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:frontend-v2.0
         docker push 891377368653.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:backend-v2.0
         docker push 891377368653.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:frontend-v2.0

      - name: Deploy and wait for healthy services
        timeout-minutes: 15
        env:
          AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: bash scripts/deploy.sh
