<polyline points="783,520 790,529 797,520" fill="none" stroke="#63D8B1" stroke-width="3" stroke-linejoin="round"/>
<rect x="290" y="530" width="300" height="112" rx="18" fill="#142B40" stroke="#395774" stroke-width="2"/>
<text x="315" y="572.0" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Frontend image</text>
<text x="315" y="614.6" fill="#86C7F2" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">frontend-v1.0</text>
<rect x="640" y="530" width="300" height="112" rx="18" fill="#142B40" stroke="#395774" stroke-width="2"/>
<text x="665" y="572.0" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Backend image</text>
<text x="665" y="614.6" fill="#86C7F2" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400">backend-v1.0</text>
