<rect x="70" y="708" width="1060" height="122" rx="20" fill="#242434" stroke="#625640" stroke-width="2"/>
<text x="96" y="744.6" fill="#F4BD76" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700">04  /  PUBLISH</text>
<text x="96" y="791.6" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700">Amazon ECR</text>
<text x="418" y="787.4" fill="#D9CBBB" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">Both images stored for the next release</text>
<rect x="70" y="864" width="1060" height="82" rx="16" fill="#111E30"/>
<text x="94" y="903.4" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">AWS authentication</text>
<text x="425" y="904.4" fill="#63D8B1" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400">GitHub OIDC  →  IAM role</text>
<text x="425" y="929.6" fill="#AEBED1" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Temporary credentials • no long-lived AWS keys</text>
<text x="70" y="1000.0" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Health tests: success • failure • recovery</text>
<text x="70" y="1040.8" fill="#AEBED1" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">Endpoint behavior tested with a mocked database.</text>
<polyline points="70,1080 1130,1080" fill="none" stroke="#2C4059" stroke-width="2" stroke-linejoin="round"/>
<text x="70" y="1119.0" fill="#F4BD76" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700">NEXT: AWS deployment + post-deployment health checks</text>
<text x="70" y="1164.4" fill="#AEBED1" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">Utkarsh Singh Rajawat</text>
<text x="525" y="1164.4" fill="#AEBED1" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400">github.com/shreyan21/CI-CD-project</text>
