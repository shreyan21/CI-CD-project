<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Portfolio CI pipeline</title>
<desc id="desc">A push to master triggers GitHub Actions backend tests, then Docker Compose builds frontend and backend images which are published to Amazon ECR. AWS authentication uses OIDC. Health tests use a mocked database. Deployment is the next milestone.</desc>
<rect width="1200" height="1200" fill="#0B1220"/>
<text x="70" y="64.2" fill="#63D8B1" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700">PROJECT UPDATE  /  CURRENT CI MILESTONE</text>
<text x="70" y="155.2" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="64" font-weight="700">Code in. Images out.</text>
<text x="70" y="217.6" fill="#AEBED1" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400">React + Express + PostgreSQL portfolio</text>
<rect x="70" y="245" width="164" height="30" rx="15" fill="#183A32"/>
<text x="86" y="262.8" fill="#82E9C8" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Verified CI run</text>
<rect x="70" y="310" width="300" height="150" rx="18" fill="#131F31" stroke="#2C4059" stroke-width="2"/>
<text x="94" y="345.4" fill="#63D8B1" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">01  /  TRIGGER</text>
<text x="94" y="384.0" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Push to master</text>
<text x="94" y="419.8" fill="#AEBED1" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">GitHub Actions starts</text>
<rect x="450" y="310" width="300" height="150" rx="18" fill="#131F31" stroke="#2C4059" stroke-width="2"/>
<text x="474" y="345.4" fill="#63D8B1" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">02  /  CHECK</text>
<text x="474" y="384.0" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Backend tests</text>
<text x="474" y="419.8" fill="#AEBED1" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">npm ci  then  npm test</text>
<rect x="830" y="310" width="300" height="150" rx="18" fill="#131F31" stroke="#2C4059" stroke-width="2"/>
<text x="854" y="345.4" fill="#63D8B1" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">03  /  PACKAGE</text>
<text x="854" y="384.0" fill="#FFFFFF" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">Compose builds</text>
<text x="854" y="419.8" fill="#AEBED1" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400">Frontend + backend</text>
<polyline points="370,385 431,385" fill="none" stroke="#556C87" stroke-width="3" stroke-linejoin="round"/>
<polyline points="422,378 431,385 422,392" fill="none" stroke="#63D8B1" stroke-width="3" stroke-linejoin="round"/>
<polyline points="750,385 811,385" fill="none" stroke="#556C87" stroke-width="3" stroke-linejoin="round"/>
<polyline points="802,378 811,385 802,392" fill="none" stroke="#63D8B1" stroke-width="3" stroke-linejoin="round"/>
<polyline points="980,460 980,492 440,492 440,529" fill="none" stroke="#556C87" stroke-width="3" stroke-linejoin="round"/>
