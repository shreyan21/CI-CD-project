<title>Portfolio Delivery on AWS</title>
<desc>GitHub Actions tests and builds frontend and backend images, publishes to ECR, and submits SSM deployment commands. EC2 runs Nginx, Express and PostgreSQL. Remote completion and health verification are follow-up work.</desc>
