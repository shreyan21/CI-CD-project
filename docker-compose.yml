services:
    db: 
      image: postgres
      environment:
         - POSTGRES_USER=admin
         - POSTGRES_DB=utkarsh_portfolio
         - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      ports:
        - '127.0.0.1:5432:5432'

      volumes:
        - myvol:/var/lib/postgresql

    
    backend:
        build: ./backend/
        image: backend:v1.0
        env_file: ./backend/.env
        environment:
          DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@db:5432/utkarsh_portfolio
        ports:
          - '127.0.0.1:4000:4000'
        depends_on: 
           - db

    frontend:
        build: ./frontend/
        image: frontend:v1.0
        env_file: ./frontend/.env 
        ports:
          - '127.0.0.1:5173:5173'
        depends_on: 
           - backend

volumes:
  myvol:
