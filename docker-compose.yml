services:
    db: 
      image: postgres
      environment:
         - POSTGRES_USER=admin
         - POSTGRES_DB=utkarsh_portfolio
         - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      ports:
        - '5432:5432'

      volumes:
        - myvol:/var/lib/postgresql

    
    backend:
        build: ./backend/
        image: backend:v1.0
        env_file: ./backend/.env
        ports:
          - '4000:4000'
        depends_on: 
           - db

    frontend:
        build: ./frontend/
        image: frontend:v1.0
        env_file: ./frontend/.env 
        ports:
          - '80:80'
        depends_on: 
           - backend

volumes:
  myvol:
